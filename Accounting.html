<script>
/* Financial books: all writes go through balanced, posted vouchers. */
window.installAccounting = function(app) {
  'use strict';
  var state=app.state,esc=app.esc,money=app.money,run=app.run,today=app.today,table=app.table,heading=app.heading,status=app.status;
  var accounts=[];
  function q(id){return document.getElementById(id);}
  function accountOptions(selected){return '<option value="">Select account</option>'+accounts.filter(function(a){return a.Status==='ACTIVE';}).map(function(a){return '<option value="'+esc(a.AccountID)+'"'+(String(a.AccountID)===String(selected||'')?' selected':'')+'>'+esc(a.AccountID+' · '+a.AccountName)+'</option>';}).join('');}
  function partyOptions(type,selected){var rows=type==='DEALER'?(state.lookups.dealers||[]):type==='SUPPLIER'?(state.lookups.agreements||[]):[],id=type==='DEALER'?'DealerID':'AgreementID',name=type==='DEALER'?'DealerName':'Company';return '<option value="">No party</option>'+rows.filter(function(r){return type!=='DEALER'||r.Status==='APPROVED'||r.Status==='ACTIVE';}).map(function(r){return '<option value="'+esc(r[id])+'"'+(String(r[id])===String(selected||'')?' selected':'')+'>'+esc(r[name]+' ('+r[id]+')')+'</option>';}).join('');}
  function pageShell(tab){var tabs=[['overview','Overview'],['setup','Setup'],['accounts','Chart of Accounts'],['vouchers','Vouchers'],['ledgers','Ledgers'],['trial','Trial Balance']];if(state.user&&state.user.Role==='ADMIN')tabs.push(['payment-methods','Payment Methods'],['expense-categories','Expense Categories']);return '<div class="card accounting-page">'+heading('Bangladesh-ready accounting','Accounting','Double-entry books · invoice trace · audit trail')+'<div class="accounting-tabs">'+tabs.map(function(x){return '<button type="button" class="secondary-button '+(tab===x[0]?'is-active':'')+'" data-accounting-tab="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div><div id="accounting-content">Loading…</div></div>';}
  function bindTabs(tab){document.querySelectorAll('[data-accounting-tab]').forEach(function(button){button.addEventListener('click',function(){render(button.dataset.accountingTab);});});}
  function renderOverview(){run('getAccountingDashboard',[],function(data){var setup=data.Setup||{},ready=setup.AccountingStartDate?'Opening balances / posting date: '+setup.AccountingStartDate:'Set the accounting start date before automatic source posting is enabled.';q('accounting-content').innerHTML='<div class="accounting-notice '+(setup.AccountingStartDate?'is-ready':'')+'"><strong>'+(setup.AccountingStartDate?'Setup date recorded':'Accounting is in safe setup mode')+'</strong><span>'+esc(ready)+' Current phase only creates manual, traceable vouchers; existing ERP transactions are not back-posted.</span></div><div class="accounting-kpis"><div><span>Posted vouchers</span><strong>'+data.VoucherCount+'</strong></div><div><span>Total debit</span><strong>৳ '+money(data.TotalDebit)+'</strong></div><div><span>Total credit</span><strong>৳ '+money(data.TotalCredit)+'</strong></div><div><span>Control</span><strong class="'+(data.IsBalanced?'good':'bad')+'">'+(data.IsBalanced?'Balanced':'Check required')+'</strong></div></div><div class="accounting-roadmap"><h3>Posting sequence</h3><p>GRN → Inventory / Supplier Payable · Delivery → Dealer Receivable or Cash / Sales + COGS / Inventory · Receipt → Cash or Bank / Dealer Receivable · Return → reversal entries.</p><p>Automatic links will be switched on only after the opening balances, VAT setting and stock costing are reviewed.</p></div>';});}
  function renderSetup(){run('getAccountingSetup',[],function(s){var admin=state.user&&state.user.Role==='ADMIN';q('accounting-content').innerHTML='<form id="accounting-setup-form" class="accounting-form"><div class="form-grid"><div class="field"><label>Financial year starts in *</label><select id="acc-fy" '+(admin?'':'disabled')+'>'+['January','February','March','April','May','June','July','August','September','October','November','December'].map(function(n,i){return '<option value="'+(i+1)+'"'+(Number(s.FinancialYearStartMonth)===i+1?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div><div class="field"><label>Currency</label><input value="BDT — Bangladeshi Taka" disabled></div><div class="field"><label>Inventory costing *</label><select id="acc-cost" '+(admin?'':'disabled')+'><option value="WEIGHTED_AVERAGE"'+(s.CostMethod==='WEIGHTED_AVERAGE'?' selected':'')+'>Weighted Average</option><option value="FIFO"'+(s.CostMethod==='FIFO'?' selected':'')+'>FIFO</option></select></div><div class="field"><label>Accounting start date</label><input id="acc-start" type="date" value="'+esc(s.AccountingStartDate||'')+'" '+(admin?'':'disabled')+'></div><div class="field"><label>Default VAT rate (%)</label><input id="acc-vat-rate" type="number" min="0" max="100" step="0.01" value="'+esc(s.DefaultVatRate||0)+'" '+(admin?'':'disabled')+'></div><div class="field"><label>VAT / BIN registration</label><label class="accounting-check"><input id="acc-vat" type="checkbox" '+(s.VatRegistered?'checked ':'')+(admin?'':'disabled')+'> Registered for VAT</label></div></div><p class="subtle">VAT rate and tax ledger are configurable. Confirm the current NBR treatment with your accountant before go-live.</p>'+(admin?'<div class="actions"><button class="primary-button" type="submit">Save Accounting Setup</button></div>':'<p class="notice">Only an Administrator can update accounting setup.</p>')+'</form>';var form=q('accounting-setup-form');form.addEventListener('submit',function(event){event.preventDefault();run('saveAccountingSetup',[{FinancialYearStartMonth:q('acc-fy').value,CostMethod:q('acc-cost').value,AccountingStartDate:q('acc-start').value,DefaultVatRate:q('acc-vat-rate').value,VatRegistered:q('acc-vat').checked}],function(){app.showMessage('Accounting setup saved. Automatic posting remains disabled until the next integration stage.');render('overview');});});});}
  function renderPaymentMethods(){if(!state.user||state.user.Role!=='ADMIN'){q('accounting-content').innerHTML='<div class="notice">Only an Administrator can manage payment methods.</div>';return;}run('getPaymentMethods',[true],function(rows){rows=rows||[];q('accounting-content').innerHTML='<div class="accounting-register"><div class="accounting-voucher-head"><div><h3>Payment Methods</h3><p class="subtle">Cash and bank channels used by receipts, payments and payroll.</p></div></div><form id="acc-payment-method-form" class="accounting-inline-form"><div class="field"><label>Payment method name *</label><input id="acc-payment-method-name" maxlength="100" placeholder="BRAC Bank / Cash Counter" required></div><button class="primary-button" type="submit">Add Payment Method</button></form>'+table(['Name','Status','Actions'],rows,function(row){var archived=String(row.Status||'ACTIVE').toUpperCase()==='ARCHIVED';return '<tr><td>'+esc(row.MethodName)+'</td><td>'+status(row.Status||'ACTIVE')+'</td><td class="table-actions"><button type="button" class="secondary-button acc-payment-edit" data-id="'+esc(row.PaymentMethodID)+'" data-name="'+esc(row.MethodName)+'">Edit</button><button type="button" class="secondary-button acc-payment-status" data-id="'+esc(row.PaymentMethodID)+'" data-name="'+esc(row.MethodName)+'" data-status="'+(archived?'ACTIVE':'ARCHIVED')+'">'+(archived?'Restore':'Archive')+'</button></td></tr>';})+'</div>';q('acc-payment-method-form').addEventListener('submit',function(event){event.preventDefault();var input=q('acc-payment-method-name'),button=this.querySelector('button[type="submit"]'),name=input.value.trim();if(!name)return;button.disabled=true;run('createPaymentMethod',[name],function(){app.showMessage('Payment method saved.');render('payment-methods');},function(){button.disabled=false;});});document.querySelectorAll('.acc-payment-edit').forEach(function(button){button.addEventListener('click',function(){var next=window.prompt('Update payment method name',button.dataset.name);if(next===null||next.trim()===button.dataset.name)return;button.disabled=true;run('updateSettingItem',['paymentMethod',button.dataset.id,{Name:next.trim()}],function(){app.showMessage('Payment method updated.');render('payment-methods');},function(){button.disabled=false;});});});document.querySelectorAll('.acc-payment-status').forEach(function(button){button.addEventListener('click',function(){var archive=button.dataset.status==='ARCHIVED';if(archive&&!window.confirm('Archive "'+button.dataset.name+'"? Existing records will remain unchanged.'))return;button.disabled=true;run('updateSettingItem',['paymentMethod',button.dataset.id,{Status:button.dataset.status}],function(){app.showMessage(archive?'Payment method archived.':'Payment method restored.');render('payment-methods');},function(){button.disabled=false;});});});});}
  function renderExpenseCategories(){if(!state.user||state.user.Role!=='ADMIN'){q('accounting-content').innerHTML='<div class="notice">Only an Administrator can manage expense categories.</div>';return;}run('getExpenseCategories',[],function(rows){rows=rows||[];q('accounting-content').innerHTML='<div class="accounting-register"><div class="accounting-voucher-head"><div><h3>Expense Categories</h3><p class="subtle">Categories used to classify operating expenses in the Expenses module.</p></div></div><form id="acc-expense-category-form" class="accounting-inline-form"><div class="field"><label>Expense category name *</label><input id="acc-expense-category-name" maxlength="100" placeholder="Delivery / Rent / Utilities" required></div><button class="primary-button" type="submit">Add Expense Category</button></form>'+table(['Category','Status','Actions'],rows,function(row){var archived=String(row.Status||'ACTIVE').toUpperCase()==='ARCHIVED';return '<tr><td>'+esc(row.CategoryName)+'</td><td>'+status(row.Status||'ACTIVE')+'</td><td class="table-actions"><button type="button" class="secondary-button acc-expense-category-edit" data-id="'+esc(row.ExpenseCategoryID)+'" data-name="'+esc(row.CategoryName)+'">Edit</button><button type="button" class="secondary-button acc-expense-category-status" data-id="'+esc(row.ExpenseCategoryID)+'" data-name="'+esc(row.CategoryName)+'" data-status="'+(archived?'ACTIVE':'ARCHIVED')+'">'+(archived?'Restore':'Archive')+'</button></td></tr>';})+'</div>';q('acc-expense-category-form').addEventListener('submit',function(event){event.preventDefault();var input=q('acc-expense-category-name'),button=this.querySelector('button[type="submit"]'),name=input.value.trim();if(!name)return;button.disabled=true;run('createExpenseCategory',[name],function(){app.showMessage('Expense category saved.');render('expense-categories');},function(){button.disabled=false;});});document.querySelectorAll('.acc-expense-category-edit').forEach(function(button){button.addEventListener('click',function(){var next=window.prompt('Update expense category name',button.dataset.name);if(next===null||!next.trim()||next.trim()===button.dataset.name)return;button.disabled=true;run('updateExpenseCategory',[button.dataset.id,{Name:next.trim()}],function(){app.showMessage('Expense category updated.');render('expense-categories');},function(){button.disabled=false;});});});document.querySelectorAll('.acc-expense-category-status').forEach(function(button){button.addEventListener('click',function(){var archive=button.dataset.status==='ARCHIVED';if(archive&&!window.confirm('Archive "'+button.dataset.name+'"? Existing expense records will remain unchanged.'))return;button.disabled=true;run('updateExpenseCategory',[button.dataset.id,{Status:button.dataset.status}],function(){app.showMessage(archive?'Expense category archived.':'Expense category restored.');render('expense-categories');},function(){button.disabled=false;});});});});}
  function renderAccounts(){run('getChartOfAccounts',[],function(rows){accounts=rows;q('accounting-content').innerHTML='<div class="accounting-split"><form id="acc-account-form" class="accounting-form"><h3>Add or update account</h3><div class="field"><label>Account code *</label><input id="acc-code" inputmode="numeric" pattern="[0-9]{4,10}" placeholder="6100" required></div><div class="field"><label>Account name *</label><input id="acc-name" maxlength="180" required></div><div class="field"><label>Type *</label><select id="acc-type"><option>ASSET</option><option>LIABILITY</option><option>EQUITY</option><option>INCOME</option><option selected>EXPENSE</option></select></div><div class="field"><label>Group</label><input id="acc-group" maxlength="80" placeholder="Operating Expenses"></div><div class="field"><label>Normal balance *</label><select id="acc-normal"><option value="DEBIT">Debit</option><option value="CREDIT">Credit</option></select></div><label class="accounting-check"><input id="acc-control" type="checkbox"> Control account</label><div class="actions"><button class="primary-button" type="submit">Save Account</button></div></form><div id="acc-account-table">'+table(['Code','Account','Type','Group','Normal','Control','Status'],rows,function(r){return '<tr><td>'+esc(r.AccountID)+'</td><td>'+esc(r.AccountName)+'</td><td>'+esc(r.AccountType)+'</td><td>'+esc(r.AccountGroup||'-')+'</td><td>'+esc(r.NormalBalance)+'</td><td>'+((Number(r.IsControl))?'Yes':'No')+'</td><td>'+status(r.Status)+'</td></tr>';})+'</div></div>';q('acc-account-form').addEventListener('submit',function(e){e.preventDefault();run('saveChartAccount',[{AccountID:q('acc-code').value,AccountName:q('acc-name').value,AccountType:q('acc-type').value,AccountGroup:q('acc-group').value,NormalBalance:q('acc-normal').value,IsControl:q('acc-control').checked,Status:'ACTIVE'}],function(){app.showMessage('Chart of account saved.');render('accounts');});});});}
  function journalLine(values){values=values||{};var row=document.createElement('div');row.className='accounting-journal-line';row.innerHTML='<select class="acc-line-account" required>'+accountOptions(values.AccountID)+'</select><input class="acc-line-debit" type="number" min="0" step="0.01" placeholder="Debit" value="'+esc(values.Debit||'')+'"><input class="acc-line-credit" type="number" min="0" step="0.01" placeholder="Credit" value="'+esc(values.Credit||'')+'"><select class="acc-line-party-type"><option value="">No party</option><option value="DEALER"'+(values.PartyType==='DEALER'?' selected':'')+'>Dealer</option><option value="SUPPLIER"'+(values.PartyType==='SUPPLIER'?' selected':'')+'>Supplier</option></select><select class="acc-line-party-id">'+partyOptions(values.PartyType,values.PartyID)+'</select><button type="button" class="danger-button acc-remove-line">×</button>';row.querySelector('.acc-line-party-type').addEventListener('change',function(){row.querySelector('.acc-line-party-id').innerHTML=partyOptions(this.value,'');});row.querySelector('.acc-remove-line').addEventListener('click',function(){if(q('acc-journal-lines').children.length>2)row.remove();});return row;}
  function renderVouchers(){run('getAccountingVouchers',[today().slice(0,7)+'-01',today()],function(rows){q('accounting-content').innerHTML='<form id="acc-voucher-form" class="accounting-form"><div class="accounting-voucher-head"><h3>Post manual voucher</h3><span>Every entry must balance before posting.</span></div><div class="form-grid"><div class="field"><label>Date *</label><input id="acc-voucher-date" type="date" value="'+today()+'" required></div><div class="field"><label>Voucher type *</label><select id="acc-voucher-type"><option value="JV">Journal Voucher</option><option value="RV">Receipt Voucher</option><option value="PV">Payment Voucher</option><option value="CV">Contra Voucher</option><option value="OB">Opening Balance</option></select></div><div class="field"><label>Source / invoice reference</label><input id="acc-voucher-source" maxlength="160" placeholder="SAL-000001"></div><div class="field field-wide"><label>Narration</label><input id="acc-voucher-narration" maxlength="500" placeholder="Clear description of the business event"></div></div><div class="accounting-line-labels"><span>Account</span><span>Debit</span><span>Credit</span><span>Party type</span><span>Dealer / Supplier</span><span></span></div><div id="acc-journal-lines"></div><div class="actions"><button type="button" class="secondary-button" id="acc-add-line">+ Add line</button><button type="submit" class="primary-button">Post Balanced Voucher</button></div></form><div class="accounting-register"><h3>Today’s voucher register</h3>'+table(['Voucher','Date','Type','Source','Narration','Debit','Credit','Action'],rows,function(v){return '<tr><td>'+esc(v.VoucherID)+'</td><td>'+esc(v.VoucherDate)+'</td><td>'+esc(v.VoucherType)+'</td><td>'+esc(v.SourceNo||'-')+'</td><td>'+esc(v.Narration||'-')+'</td><td>৳ '+money(v.TotalDebit)+'</td><td>৳ '+money(v.TotalCredit)+'</td><td><button type="button" class="secondary-button acc-view-voucher" data-id="'+esc(v.VoucherID)+'">View</button></td></tr>';})+'</div>';var list=q('acc-journal-lines');list.appendChild(journalLine());list.appendChild(journalLine());q('acc-add-line').addEventListener('click',function(){list.appendChild(journalLine());});q('acc-voucher-form').addEventListener('submit',function(event){event.preventDefault();var lines=Array.prototype.map.call(list.children,function(line){return {AccountID:line.querySelector('.acc-line-account').value,Debit:line.querySelector('.acc-line-debit').value||0,Credit:line.querySelector('.acc-line-credit').value||0,PartyType:line.querySelector('.acc-line-party-type').value,PartyID:line.querySelector('.acc-line-party-id').value};});run('createAccountingVoucher',[{VoucherDate:q('acc-voucher-date').value,VoucherType:q('acc-voucher-type').value,SourceNo:q('acc-voucher-source').value,Narration:q('acc-voucher-narration').value,Lines:lines}],function(result){app.showMessage('Voucher '+result.VoucherID+' posted with a complete audit trail.');render('vouchers');});});document.querySelectorAll('.acc-view-voucher').forEach(function(b){b.addEventListener('click',function(){showVoucher(b.dataset.id);});});});}
  function showVoucher(id){run('getAccountingVoucher',[id],function(v){if(!v)return;var modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML='<div class="modal-card accounting-voucher-modal"><div class="modal-card-header"><div><p class="eyebrow">'+esc(v.VoucherType)+' · '+esc(v.Status)+'</p><h2>'+esc(v.VoucherID)+'</h2><p class="subtle">'+esc(v.VoucherDate)+' · '+esc(v.SourceNo||'No source reference')+'</p></div><button type="button" class="modal-close">×</button></div><p>'+esc(v.Narration||'-')+'</p>'+table(['#','Account','Debit','Credit','Party','Reference'],v.Lines,function(l){return '<tr><td>'+l.LineNo+'</td><td>'+esc(l.AccountID)+'</td><td>৳ '+money(l.Debit)+'</td><td>৳ '+money(l.Credit)+'</td><td>'+esc((l.PartyType||'')+' '+(l.PartyID||''))+'</td><td>'+esc(l.ReferenceNo||'-')+'</td></tr>';})+'<div class="modal-actions">'+(state.user&&state.user.Role==='ADMIN'&&v.SourceType==='MANUAL'&&v.Status==='POSTED'?'<button type="button" class="danger-button acc-reverse">Reverse in today\'s date</button>':'')+'<button type="button" class="secondary-button acc-close">Close</button></div></div>';document.body.appendChild(modal);modal.querySelectorAll('.modal-close,.acc-close').forEach(function(b){b.addEventListener('click',function(){modal.remove();});});var reverse=modal.querySelector('.acc-reverse');if(reverse)reverse.addEventListener('click',function(){if(!window.confirm('Create a reversing voucher for '+v.VoucherID+'?'))return;run('reverseAccountingVoucher',[v.VoucherID,today()],function(result){modal.remove();app.showMessage('Reversal voucher '+result.VoucherID+' posted.');render('vouchers');});});});}
  function renderLedgers(){q('accounting-content').innerHTML='<form id="acc-ledger-filter" class="accounting-form"><div class="form-grid"><div class="field"><label>Ledger type</label><select id="acc-ledger-type"><option value="ACCOUNT">General ledger account</option><option value="DEALER">Dealer receivable ledger</option><option value="SUPPLIER">Supplier payable ledger</option></select></div><div class="field"><label id="acc-ledger-entity-label">Account</label><select id="acc-ledger-entity">'+accountOptions()+'</select></div><div class="field"><label>From</label><input id="acc-ledger-from" type="date" value="'+today().slice(0,7)+'-01"></div><div class="field"><label>To</label><input id="acc-ledger-to" type="date" value="'+today()+'"></div></div><div class="actions"><button class="primary-button" type="submit">View Ledger</button></div></form><div id="acc-ledger-output"></div>';function entities(){var type=q('acc-ledger-type').value,qEntity=q('acc-ledger-entity');q('acc-ledger-entity-label').textContent=type==='ACCOUNT'?'Account':type==='DEALER'?'Dealer':'Supplier';qEntity.innerHTML=type==='ACCOUNT'?accountOptions():partyOptions(type,'');}q('acc-ledger-type').addEventListener('change',entities);q('acc-ledger-filter').addEventListener('submit',function(e){e.preventDefault();var type=q('acc-ledger-type').value,id=q('acc-ledger-entity').value,from=q('acc-ledger-from').value,to=q('acc-ledger-to').value;if(!id){app.showMessage('Select a ledger first.','error');return;}var method=type==='ACCOUNT'?'getAccountingAccountLedger':'getAccountingPartyLedger',args=type==='ACCOUNT'?[id,from,to]:[type,id,from,to];run(method,args,function(data){q('acc-ledger-output').innerHTML='<div class="accounting-register"><h3>'+esc(type==='ACCOUNT'?data.Account.AccountName:data.PartyType+' '+data.PartyID)+'</h3>'+table(['Date','Voucher','Source','Narration','Debit','Credit','Balance'],data.Rows,function(r){return '<tr><td>'+esc(r.VoucherDate)+'</td><td>'+esc(r.VoucherID)+'</td><td>'+esc(r.SourceNo||r.SourceID||'-')+'</td><td>'+esc(r.Narration||r.VoucherNarration||'-')+'</td><td>৳ '+money(r.Debit)+'</td><td>৳ '+money(r.Credit)+'</td><td>৳ '+money(r.Balance)+' '+esc(r.BalanceSide==='DEBIT'?'Dr':'Cr')+'</td></tr>';})+'</div>';});});}
  function renderTrial(){q('accounting-content').innerHTML='<form id="acc-trial-filter" class="accounting-form accounting-inline-form"><div class="field"><label>As of date</label><input id="acc-trial-date" type="date" value="'+today()+'"></div><button class="primary-button" type="submit">Load Trial Balance</button></form><div id="acc-trial-output">Loading…</div>';function load(){run('getAccountingTrialBalance',[q('acc-trial-date').value],function(data){var active=data.Rows.filter(function(r){return Number(r.Debit)||Number(r.Credit);});q('acc-trial-output').innerHTML='<div class="accounting-register"><div class="accounting-voucher-head"><h3>Trial Balance</h3><strong class="'+(Math.abs(data.TotalDebit-data.TotalCredit)<.005?'good':'bad')+'">Debit ৳ '+money(data.TotalDebit)+' · Credit ৳ '+money(data.TotalCredit)+'</strong></div>'+table(['Code','Account','Type','Debit','Credit','Balance'],active,function(r){return '<tr><td>'+esc(r.AccountID)+'</td><td>'+esc(r.AccountName)+'</td><td>'+esc(r.AccountType)+'</td><td>৳ '+money(r.Debit)+'</td><td>৳ '+money(r.Credit)+'</td><td>৳ '+money(r.Balance)+' '+esc(r.BalanceSide==='DEBIT'?'Dr':'Cr')+'</td></tr>';})+'</div>';});}q('acc-trial-filter').addEventListener('submit',function(e){e.preventDefault();load();});load();}
  function render(tab){tab=tab||'overview';if((tab==='payment-methods'||tab==='expense-categories')&&(!state.user||state.user.Role!=='ADMIN'))tab='overview';q('app-view').innerHTML=pageShell(tab);bindTabs(tab);if(tab==='payment-methods'){renderPaymentMethods();return;}if(tab==='expense-categories'){renderExpenseCategories();return;}run('getChartOfAccounts',[],function(rows){accounts=rows||[];({overview:renderOverview,setup:renderSetup,accounts:renderAccounts,vouchers:renderVouchers,ledgers:renderLedgers,trial:renderTrial}[tab]||renderOverview)();});}
  return render;
};
</script>
